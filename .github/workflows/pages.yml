name: Deploy web app (GitHub Pages)

# 發布 GitHub Release 時，把該版本的 site/ 部署到 GitHub Pages。
# 網頁啟動時會查詢最新 Release，偵測到新版就提示使用者重新載入（見 site/js/update.js）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag must match APP_VERSION
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(grep -oP "APP_VERSION = '\K[^']+" site/js/version.js)
          if [ "v$v" != "$TAG" ] && [ "$v" != "$TAG" ]; then
            echo "Release tag ($TAG) 與 site/js/version.js 的 APP_VERSION ($v) 不一致，已中止部署" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
